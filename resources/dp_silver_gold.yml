# Declarative (Lakeflow) silver + gold pipeline.
#

resources:
  pipelines:
    declarative_silver_gold_pipeline:
      name: rearc_dp_silver_gold
      catalog: ${var.catalog_prefix}_${var.env}
      # default target for unqualified dataset names, which is the silver layer
      schema: silver
      serverless: true
      continuous: false

      configuration:
        env: ${var.env}
        catalog_prefix: ${var.catalog_prefix}

      libraries:
        - glob:
            include: ../src/silver/**
        - glob:
            include: ../src/gold/**

  jobs:
    declarative_silver_gold_job:
      name: rearc_dp_silver_gold

      parameters:
        - name: env
          default: ${var.env}
        - name: catalog_prefix
          default: ${var.catalog_prefix}

      tasks:
        - task_key: refresh_silver_gold_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.declarative_silver_gold_pipeline.id}
