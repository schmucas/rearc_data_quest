# One-time environment setup.
#
# DESTRUCTIVE: environment_setup.ipynb drops and recreates <prefix>_<env> and
# the ingest schema, so this job is never scheduled. Run it by hand:
#   databricks bundle run setup_job --target dev

resources:
  jobs:
    setup_job:
      name: rearc_setup_job

      parameters:
        - name: env
          default: ${var.env}
        - name: catalog_prefix
          default: ${var.catalog_prefix}

      tasks:
        - task_key: environment_setup
          notebook_task:
            notebook_path: ../src/setup/environment_setup.ipynb
