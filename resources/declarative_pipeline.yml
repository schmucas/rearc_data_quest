# Declarative (Lakeflow) bronze + silver + gold pipeline.
#
# One pipeline covers all three layers and resolves bronze -> silver -> gold
# ordering itself, so there is no hand-declared depends_on graph here.
#
# Naming rule in src/: bare dataset names resolve against `schema:` below, so
# silver datasets are bare and anything outside silver (bronze sources, gold
# targets) is fully qualified. Changing `schema` therefore moves the silver layer.
#
# Pipelines have no widgets: source files read `env` and `catalog_prefix` with
# spark.conf.get(), which is why both are restated in `configuration` below.

resources:
  pipelines:
    declarative_silver_gold_pipeline:
      name: rearc_dp_silver_gold
      catalog: ${var.catalog_prefix}_${var.env}
      # default target for unqualified dataset names, which is the silver layer
      schema: silver
      serverless: true
      continuous: false

      configuration:
        env: ${var.env}
        catalog_prefix: ${var.catalog_prefix}

      libraries:
        - glob:
            include: ../src/bronze/**
        - glob:
            include: ../src/silver/**
        - glob:
            include: ../src/gold/**

      # No `environment.dependencies` block: nothing outside the pipeline is
      # imported. Add one here if source files start importing a utils wheel.

  jobs:
    declarative_pipeline_silver_gold:
      name: rearc_declarative_pipeline_silver_gold

      parameters:
        - name: env
          default: ${var.env}
        - name: catalog_prefix
          default: ${var.catalog_prefix}

      tasks:
        - task_key: refresh_declarative_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.declarative_silver_gold_pipeline.id}
