name: Source Fetch → Landing

# Manual dispatch only for now. Scheduling (cron) is deferred until stage/prod
# have their own ingest schemas set up -- see the sourcing fetcher plan.
#
# One workspace, one DATABRICKS_HOST/TOKEN pair regardless of the env picked
# below -- same convention as deploy-stage.yml/deploy-prod.yml. Only `dev` has
# actually been deployed and run through setup_job so far; picking stage/prod
# here will fail until those environments' ingest schema + source_manifest
# table exist.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options:
          - dev
          - stage
          - prod
        default: dev

jobs:
  fetch:
    name: Fetch BLS + DataUSA into landing (${{ inputs.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group sourcing

      - name: Fetch sources into landing
        run: uv run python -m sourcing --env ${{ inputs.env }}
