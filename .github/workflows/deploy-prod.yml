name: Deploy → Prod

on:
  push:
    tags:
      - 'v*'   # catches all version tags; RC tags are excluded by the job condition below
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual prod deploy'
        required: false

jobs:
  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    # Skip RC tags (v*-rc*) — those are handled by deploy-stage.yml
    if: ${{ !contains(github.ref_name, '-rc') }}

    environment: production

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group sourcing

      - uses: databricks/setup-cli@main

      # First deploy to a brand-new environment fails otherwise: the
      # declarative pipeline resource requires its target catalog to already
      # exist, but that catalog is normally created by setup_job, which can't
      # run until the bundle has been deployed once. Idempotent, safe on
      # every deploy.
      - name: Ensure target catalog exists
        run: uv run python -m scripts.ensure_catalog --env prod

      - name: Deploy bundle (prod)
        run: databricks bundle deploy --target prod
